
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul de fréquence de rotation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5fc;
            color: #1f5b9e;
            margin: 0;
            padding: 30px 15px;
        }

        .calculateur {
            max-width: 650px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px #00000015;
        }

        header {
            background: #4472c4;
            color: white;
            padding: 25px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 27px;
        }

        .contenu {
            padding: 30px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 2px solid #ed7d31;
            border-radius: 10px;
            font-size: 17px;
            background: white;
            color: #1f5b9e;
        }

        .diametre {
            margin-top: 30px;
        }

        .reglage {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reglage button {
            background: #eaf2fc;
            color: #4472c4;
            border: none;
            border-radius: 10px;
            font-size: 25px;
            font-weight: bold;
            width: 45px;
            height: 45px;
            cursor: pointer;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #ed7d31;
            cursor: pointer;
        }

        #valeurDiametre {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0 25px;
        }

        .calculer {
            width: 100%;
            padding: 16px;
            background: #ed7d31;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .calculer:hover {
            background: #d96820;
        }

        .resultat {
            margin-top: 25px;
            padding: 25px 15px;
            background: #eaf2fc;
            border-radius: 12px;
            text-align: center;
        }

        .resultat p {
            margin: 0 0 10px;
        }

        #frequence {
            font-size: 32px;
            font-weight: bold;
            color: #ed7d31;
        }

        .erreur {
            color: #b42318;
            font-weight: bold;
        }

        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #4472c4;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="calculateur">

    <header>
        <h1>Calcul de la fréquence de rotation</h1>
        <p>Choisir le matériau et régler le diamètre</p>
    </header>

    <div class="contenu">

        <label for="materiau">Matériau</label>
        <select id="materiau">
            <option value="10">Acier</option>
            <option value="22">Fonte</option>
            <option value="50">Bronze</option>
            <option value="60">Laiton</option>
        </select>

        <div class="diametre">
            <label for="diametre">Diamètre en mm</label>

            <div class="reglage">
                <button type="button" onclick="modifier(-1)"
                        aria-label="Diminuer le diamètre">−</button>

                <input type="range" id="diametre"
                       min="1" max="200" step="1" value="25">

                <button type="button" onclick="modifier(1)"
                        aria-label="Augmenter le diamètre">+</button>
            </div>

            <div id="valeurDiametre">25 mm</div>
        </div>

        <button class="calculer" onclick="calculer()">
            Calculer
        </button>

        <div class="resultat" aria-live="polite">
            <p>Fréquence de rotation</p>
            <div id="frequence">— tr/min</div>
            <p id="message"></p>
        </div>

        <div class="info">
            <strong>Valeurs de vitesse selon le matériau :</strong><br>
            Acier : 10 | Fonte : 22 | Bronze : 50 | Laiton : 60
        </div>

    </div>
</div>

<script>
    const diametre = document.getElementById("diametre");
    const valeurDiametre = document.getElementById("valeurDiametre");

    function modifier(increment) {
        diametre.value = Number(diametre.value) + increment;
        actualiserDiametre();
    }

    function actualiserDiametre() {
        valeurDiametre.textContent = diametre.value + " mm";
    }

    diametre.addEventListener("input", actualiserDiametre);

    function calculer() {
        const v = Number(document.getElementById("materiau").value);
        const d = Number(diametre.value);
        const f = (1000 * v) / (Math.PI * d);

        document.getElementById("frequence").textContent =
            Math.round(f) + " tr/min";

        document.getElementById("message").textContent = "";
    }

    calculer();
</script>

</body>
</html>
